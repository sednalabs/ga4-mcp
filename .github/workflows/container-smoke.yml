name: GA4 container smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docs/container.md
      - .github/workflows/container-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build release image
        run: docker build --pull --progress=plain -t ga4-mcp:container-ci .

      - name: Verify runtime is unprivileged and includes both binaries
        run: |
          docker run --rm --entrypoint /bin/sh ga4-mcp:container-ci -c '
            test "$(id -u)" -eq 10001 &&
            test "$(id -g)" -eq 10001 &&
            test -x /usr/local/bin/ga4-mcp &&
            test -x /usr/local/bin/ga4-mcp-http
          '

      - name: Verify read-only tool enumeration without credentials
        run: |
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            -e GOOGLE_ANALYTICS_MCP_UPSTREAM_TOKEN_SOURCE=request_header \
            ga4-mcp:container-ci --print-tools > tools.json
          python3 - <<'PY'
          import json
          with open("tools.json", encoding="utf-8") as stream:
              tools = json.load(stream)
          assert isinstance(tools, list) and "run_report" in tools, tools
          print(f"Validated {len(tools)} GA4 MCP tool names")
          PY
