name: Migration lockfile candidate

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - .github/workflows/dependency-lock-candidate.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Generate candidate lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          sha256sum Cargo.lock
          printf '%s\n' 'GA4_LOCKFILE_BEGIN'
          sed 's/^/GA4_LOCK|/' Cargo.lock
          printf '%s\n' 'GA4_LOCKFILE_END'
      - name: Upload candidate lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ga4-cargo-lock-candidate
          path: Cargo.lock
          if-no-files-found: error
