name: migration-lockfile
# Temporary read-only migration qualification; remove before landing.
on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - ".github/workflows/migration-lockfile.yml"
permissions:
  contents: read
jobs:
  resolve-lockfile:
    if: github.head_ref == 'chatgpt/w19594-toolkit-runtime-migration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Generate dependency lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          sha256sum Cargo.lock
          wc -l Cargo.lock
          echo 'LOCKFILE_BEGIN'
          sed 's/^/LOCKFILE|/' Cargo.lock
          echo 'LOCKFILE_END'
      - name: Validate resolution
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
